# Install these locations inside both bengarlock.com server blocks in
# /etc/nginx/conf.d/default.conf.

location = /firstproject {
    return 308 /firstproject/;
}

location ^~ /firstproject/api/ {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:6436/;
}

location /firstproject/ {
    root /home/deploy/Projects/table_host_old_original/front_end/build;
    rewrite ^/firstproject/(.*)$ /$1 break;
    try_files $uri $uri/ /index.html;
}
