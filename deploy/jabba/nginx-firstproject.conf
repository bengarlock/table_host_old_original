# Install these locations inside both bengarlock.com server blocks in
# /etc/nginx/conf.d/default.conf.

location = /firstproject {
    return 308 /firstproject/;
}

location ^~ /firstproject/api/ {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:6436/;
}

location = /firstproject/ {
    alias /home/deploy/Projects/table_host_old_original/front_end/build/index.html;
}

location ^~ /firstproject/static/ {
    alias /home/deploy/Projects/table_host_old_original/front_end/build/static/;
}

location = /firstproject/favicon.ico {
    alias /home/deploy/Projects/table_host_old_original/front_end/build/favicon.ico;
}

location = /firstproject/manifest.json {
    alias /home/deploy/Projects/table_host_old_original/front_end/build/manifest.json;
}

location /firstproject/ {
    rewrite ^ /firstproject/ last;
}
