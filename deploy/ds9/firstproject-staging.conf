location = /firstproject {
    return 308 /firstproject/;
}

location ^~ /firstproject/api/ {
    proxy_set_header Host 127.0.0.1:6436;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:6436/;
}

location = /firstproject/ {
    rewrite ^ /firstproject/index.html last;
}

location = /firstproject/index.html {
    alias /var/www/table-host-legacy-staging/index.html;
}

location ^~ /firstproject/static/ {
    alias /var/www/table-host-legacy-staging/static/;
}

location = /firstproject/favicon.ico {
    alias /var/www/table-host-legacy-staging/favicon.ico;
}

location = /firstproject/manifest.json {
    alias /var/www/table-host-legacy-staging/manifest.json;
}

location /firstproject/ {
    rewrite ^ /firstproject/ last;
}
